[project]
name = "pipeline-monitoring"
version = "0.1.0"
description = "Observabilidade de pipelines: métricas de execução (SQLite), logs e regras de alerta simples. Base para Airflow + Grafana."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
